<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9c4"/>
      <stop offset="100%" style="stop-color:#fff59d"/>
    </linearGradient>
  </defs>
  
  <!-- Vibrant background -->
  <rect width="1024" height="500" fill="url(#bg3)"/>
  
  <!-- White pattern overlay -->
  <g fill="white" opacity="0.1">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="900" cy="400" r="100"/>
    <circle cx="200" cy="450" r="60"/>
    <circle cx="850" cy="80" r="70"/>
  </g>
  
  <!-- Large map on right -->
  <g transform="translate(550, 50)">
    <rect x="0" y="0" width="420" height="400" rx="20" fill="white" opacity="0.95"/>
    
    <!-- Map streets pattern -->
    <g stroke="#e0e0e0" stroke-width="2">
      <line x1="0" y1="80" x2="420" y2="80"/>
      <line x1="0" y1="160" x2="420" y2="160"/>
      <line x1="0" y1="240" x2="420" y2="240"/>
      <line x1="0" y1="320" x2="420" y2="320"/>
      <line x1="84" y1="0" x2="84" y2="400"/>
      <line x1="168" y1="0" x2="168" y2="400"/>
      <line x1="252" y1="0" x2="252" y2="400"/>
      <line x1="336" y1="0" x2="336" y2="400"/>
    </g>
    
    <!-- Central Park -->
    <rect x="120" y="30" width="180" height="100" rx="8" fill="#66bb6a" opacity="0.6"/>
    <text x="180" y="90" font-family="Arial" font-size="14" fill="#2e7d32" text-anchor="middle">Central Park</text>
    
    <!-- Hudson River left side -->
    <rect x="0" y="0" width="40" height="400" rx="0" fill="#64b5f6" opacity="0.4"/>
    
    <!-- Big colorful markers -->
    <g font-size="36">
      <!-- Red - Attractions -->
      <text x="60" y="130">📍</text>
      <text x="300" y="100">🏙️</text>
      
      <!-- Purple - Harry Potter -->
      <text x="180" y="180">⚡</text>
      <text x="280" y="200">🪄</text>
      
      <!-- Orange - Food -->
      <text x="100" y="280">🍕</text>
      <text x="350" y="250">🍪</text>
      
      <!-- Blue - Museums -->
      <text x="200" y="300">🏛️</text>
      
      <!-- Green - Shopping -->
      <text x="60" y="360">🛍️</text>
      
      <!-- Pink - Movies -->
      <text x="300" y="350">🎬</text>
      
      <!-- Liberty -->
      <text x="15" y="380">🗽</text>
    </g>
    
    <!-- GPS location pulse -->
    <circle cx="200" cy="200" r="15" fill="#667eea" opacity="0.3">
      <animate attributeName="r" from="10" to="30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="8" fill="#667eea"/>
  </g>
  
  <!-- Left side content -->
  <g transform="translate(50, 100)">
    <!-- App name -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">NYC</text>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">Teen</text>
    <text x="0" y="200" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">Guide</text>
    
    <!-- Tagline in bubble -->
    <rect x="0" y="230" width="400" height="45" rx="22" fill="white" opacity="0.95"/>
    <text x="200" y="260" font-family="Arial, sans-serif" font-size="20" fill="#667eea" text-anchor="middle" font-weight="bold">🗺️ Interactive Map • ⚡ Harry Potter</text>
    
    <!-- Features -->
    <text x="0" y="320" font-family="Arial, sans-serif" font-size="22" fill="white" opacity="0.95">👨‍👩‍👧‍👦 Perfect for Families!</text>
  </g>
</svg>