<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Phone Frame -->
  <rect width="390" height="844" rx="40" fill="#1a1a1a"/>
  <rect x="10" y="10" width="370" height="824" rx="32" fill="#f5f6fa"/>
  
  <!-- Status Bar -->
  <rect x="10" y="10" width="370" height="50" rx="32" fill="#4285f4"/>
  <text x="30" y="40" fill="white" font-family="Arial" font-size="14">9:41</text>
  <text x="320" y="40" fill="white" font-family="Arial" font-size="14">100% 🔋</text>
  
  <!-- Navigation Header -->
  <rect x="10" y="60" width="370" height="80" fill="#4285f4"/>
  <text x="30" y="90" fill="white" font-family="Arial" font-size="12">◀ Indietro</text>
  <text x="120" y="95" fill="white" font-family="Arial" font-size="18" font-weight="bold">🧭 Navigazione</text>
  <text x="90" y="125" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="14">Verso: Joe's Pizza 🍕</text>
  
  <!-- Map Area with Route -->
  <rect x="10" y="140" width="370" height="480" fill="#e8f4e5"/>
  
  <!-- Street Grid -->
  <line x1="10" y1="250" x2="380" y2="250" stroke="#ccc" stroke-width="2"/>
  <line x1="10" y1="350" x2="380" y2="350" stroke="#bbb" stroke-width="3"/>
  <line x1="10" y1="450" x2="380" y2="450" stroke="#ccc" stroke-width="2"/>
  <line x1="10" y1="550" x2="380" y2="550" stroke="#ccc" stroke-width="2"/>
  <line x1="100" y1="140" x2="100" y2="620" stroke="#ccc" stroke-width="2"/>
  <line x1="195" y1="140" x2="195" y2="620" stroke="#bbb" stroke-width="3"/>
  <line x1="290" y1="140" x2="290" y2="620" stroke="#ccc" stroke-width="2"/>
  
  <!-- Route Line -->
  <path d="M 195 500 L 195 350 L 290 350 L 290 250" 
        stroke="#4285f4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 195 500 L 195 350 L 290 350 L 290 250" 
        stroke="#6fa8ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10,10">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- User Location (Start) -->
  <circle cx="195" cy="500" r="12" fill="#4285f4" stroke="white" stroke-width="3"/>
  <circle cx="195" cy="500" r="20" fill="rgba(66,133,244,0.3)"/>
  <text x="140" y="535" fill="#333" font-family="Arial" font-size="11" font-weight="bold">📍 Tu sei qui</text>
  
  <!-- Destination Marker -->
  <circle cx="290" cy="250" r="16" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="282" y="256" font-size="16">🍕</text>
  <rect x="230" y="195" width="120" height="35" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="240" y="218" fill="#333" font-family="Arial" font-size="12" font-weight="bold">Joe's Pizza</text>
  
  <!-- Distance/Time Info -->
  <rect x="20" y="580" width="350" height="30" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="40" y="600" fill="#333" font-family="Arial" font-size="12">🚶 350m • ⏱️ 5 min a piedi</text>
  
  <!-- Bottom Action Card -->
  <rect x="10" y="630" width="370" height="180" rx="20" fill="white" filter="url(#shadow)"/>
  
  <!-- Destination Info -->
  <circle cx="50" cy="680" r="28" fill="#fff3e6" stroke="#F39C12" stroke-width="2"/>
  <text x="38" y="688" font-size="24">🍕</text>
  
  <text x="90" y="665" fill="#333" font-family="Arial" font-size="16" font-weight="bold">Joe's Pizza</text>
  <text x="90" y="685" fill="#666" font-family="Arial" font-size="12">7 Carmine St, Greenwich Village</text>
  <text x="90" y="705" fill="#888" font-family="Arial" font-size="11">⭐ 4.9 • 💵 $3 • ⏱️ 20min</text>
  
  <!-- Action Buttons -->
  <rect x="20" y="730" width="165" height="50" rx="12" fill="url(#gradient1)"/>
  <text x="45" y="762" fill="white" font-family="Arial" font-size="14" font-weight="bold">🗺️ Apple Maps</text>
  
  <rect x="195" y="730" width="165" height="50" rx="12" fill="#34a853"/>
  <text x="215" y="762" fill="white" font-family="Arial" font-size="14" font-weight="bold">📍 Google Maps</text>
  
  <!-- Home Indicator -->
  <rect x="145" y="800" width="100" height="5" rx="2" fill="#333"/>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>