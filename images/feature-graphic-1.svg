<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  
  <!-- Map mockup on left side -->
  <g transform="translate(50, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="220" height="400" rx="25" fill="#1a1a2e" stroke="#333" stroke-width="3"/>
    <rect x="10" y="40" width="200" height="320" rx="5" fill="url(#mapGrad)"/>
    
    <!-- Map streets -->
    <g stroke="#fff" stroke-width="2" opacity="0.7">
      <line x1="10" y1="100" x2="210" y2="100"/>
      <line x1="10" y1="160" x2="210" y2="160"/>
      <line x1="10" y1="220" x2="210" y2="220"/>
      <line x1="10" y1="280" x2="210" y2="280"/>
      <line x1="60" y1="40" x2="60" y2="360"/>
      <line x1="110" y1="40" x2="110" y2="360"/>
      <line x1="160" y1="40" x2="160" y2="360"/>
    </g>
    
    <!-- Central Park (green rectangle) -->
    <rect x="70" y="60" width="80" height="100" rx="5" fill="#4caf50" opacity="0.6"/>
    
    <!-- Map markers -->
    <g font-size="24">
      <text x="40" y="95">📍</text>
      <text x="90" y="140">⚡</text>
      <text x="140" y="200">🍕</text>
      <text x="70" y="260">🗽</text>
      <text x="150" y="300">🎬</text>
      <text x="30" y="180">🛍️</text>
      <text x="170" y="130">🏛️</text>
    </g>
    
    <!-- Phone notch -->
    <rect x="70" y="10" width="80" height="20" rx="10" fill="#000"/>
  </g>
  
  <!-- Main text content -->
  <g transform="translate(320, 80)">
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">NYC Teen</text>
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">Guide</text>
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="50" fill="white" opacity="0.9" dx="230">🗽</text>
    
    <!-- Tagline -->
    <text x="0" y="200" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.95">Your Family Map to NYC Magic!</text>
    
    <!-- Features -->
    <g font-family="Arial, sans-serif" font-size="22" fill="white">
      <text x="0" y="270">⚡ Harry Potter Spots</text>
      <text x="280" y="270">🗺️ 300+ Places</text>
      <text x="0" y="310">🍕 Teen-Friendly Food</text>
      <text x="280" y="310">🎬 Movie Locations</text>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <text x="920" y="80" font-size="50" opacity="0.3">✨</text>
  <text x="880" y="450" font-size="40" opacity="0.3">🌟</text>
  <text x="750" y="400" font-size="35" opacity="0.2">⭐</text>
</svg>