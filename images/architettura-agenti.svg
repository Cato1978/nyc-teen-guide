<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" fill="#333" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">🏗️ Architettura a Due Agenti</text>
  
  <!-- Main Container -->
  <rect x="50" y="70" width="700" height="400" rx="20" fill="white" stroke="#667eea" stroke-width="3"/>
  <text x="400" y="100" fill="#667eea" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">NYC Teen Guide</text>
  
  <!-- Agent 1: Filtri -->
  <rect x="80" y="130" width="280" height="180" rx="15" fill="#e7f3ff" stroke="#3498db" stroke-width="2"/>
  <rect x="80" y="130" width="280" height="40" rx="15" fill="#3498db"/>
  <text x="220" y="157" fill="white" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">🎛️ AGENTE FILTRI</text>
  
  <text x="100" y="195" fill="#333" font-family="Arial" font-size="12" font-weight="bold">Input:</text>
  <text x="100" y="215" fill="#555" font-family="Arial" font-size="11">• Click su chip categoria</text>
  <text x="100" y="232" fill="#555" font-family="Arial" font-size="11">• Selezione tempo</text>
  <text x="100" y="249" fill="#555" font-family="Arial" font-size="11">• Posizione GPS</text>
  
  <text x="100" y="275" fill="#333" font-family="Arial" font-size="12" font-weight="bold">Output:</text>
  <text x="100" y="295" fill="#555" font-family="Arial" font-size="11">• Marker filtrati sulla mappa</text>
  
  <!-- Agent 2: Chatbot -->
  <rect x="440" y="130" width="280" height="180" rx="15" fill="#f3e8ff" stroke="#9b59b6" stroke-width="2"/>
  <rect x="440" y="130" width="280" height="40" rx="15" fill="#9b59b6"/>
  <text x="580" y="157" fill="white" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">💬 AGENTE CHATBOT</text>
  
  <text x="460" y="195" fill="#333" font-family="Arial" font-size="12" font-weight="bold">Input:</text>
  <text x="460" y="215" fill="#555" font-family="Arial" font-size="11">• Testo in linguaggio naturale</text>
  <text x="460" y="232" fill="#555" font-family="Arial" font-size="11">• Quick actions</text>
  
  <text x="460" y="262" fill="#333" font-family="Arial" font-size="12" font-weight="bold">Output:</text>
  <text x="460" y="282" fill="#555" font-family="Arial" font-size="11">• Suggerimenti con pulsanti</text>
  <text x="460" y="299" fill="#555" font-family="Arial" font-size="11">• Lista luoghi cliccabili</text>
  
  <!-- Database -->
  <rect x="300" y="340" width="200" height="60" rx="12" fill="#fff3e6" stroke="#f39c12" stroke-width="2"/>
  <text x="400" y="377" fill="#e67e22" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">📊 DATABASE</text>
  <text x="400" y="393" fill="#666" font-family="Arial" font-size="11" text-anchor="middle">200 luoghi</text>
  
  <!-- Map -->
  <rect x="300" y="420" width="200" height="40" rx="10" fill="#e8f4e5" stroke="#2ecc71" stroke-width="2"/>
  <text x="400" y="446" fill="#27ae60" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">🗺️ MAPPA (Leaflet.js)</text>
  
  <!-- Arrows -->
  <!-- Agent 1 to Database -->
  <line x1="220" y1="310" x2="300" y2="360" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Agent 2 to Database -->
  <line x1="580" y1="310" x2="500" y2="360" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Database to Map -->
  <line x1="400" y1="400" x2="400" y2="420" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Collaboration Arrow -->
  <path d="M 360 220 L 380 220 L 380 240 L 420 240 L 420 220 L 440 220" 
        stroke="#667eea" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="400" y="260" fill="#667eea" font-family="Arial" font-size="10" text-anchor="middle">condivisione</text>
  
  <!-- Legend -->
  <rect x="80" y="420" width="180" height="40" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <circle cx="100" cy="440" r="8" fill="#3498db"/>
  <text x="115" y="444" fill="#333" font-family="Arial" font-size="10">Selezione visuale</text>
  <circle cx="180" cy="440" r="8" fill="#9b59b6"/>
  <text x="195" y="444" fill="#333" font-family="Arial" font-size="10">NLP basico</text>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>