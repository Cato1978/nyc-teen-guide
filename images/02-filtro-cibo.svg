<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Phone Frame -->
  <rect width="390" height="844" rx="40" fill="#1a1a1a"/>
  <rect x="10" y="10" width="370" height="824" rx="32" fill="#f5f6fa"/>
  
  <!-- Status Bar -->
  <rect x="10" y="10" width="370" height="50" rx="32" fill="url(#gradient1)"/>
  <text x="30" y="40" fill="white" font-family="Arial" font-size="14">9:41</text>
  <text x="320" y="40" fill="white" font-family="Arial" font-size="14">100% 🔋</text>
  
  <!-- Search Bar -->
  <rect x="20" y="70" width="350" height="50" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="40" y="100" fill="#888" font-family="Arial" font-size="14">🔍 Cerca indirizzo...</text>
  <rect x="320" y="78" width="40" height="34" rx="8" fill="#2ecc71"/>
  <text x="332" y="100" fill="white" font-family="Arial" font-size="16">📍</text>
  
  <!-- Filter Chips - CIBO ATTIVO -->
  <rect x="20" y="130" width="60" height="30" rx="15" fill="#eee"/>
  <text x="28" y="150" fill="#333" font-family="Arial" font-size="11">🗽 Tutti</text>
  
  <rect x="85" y="130" width="55" height="30" rx="15" fill="#eee"/>
  <text x="93" y="150" fill="#333" font-family="Arial" font-size="11">🎢 Attr</text>
  
  <rect x="145" y="130" width="60" height="30" rx="15" fill="#eee"/>
  <text x="150" y="150" fill="#333" font-family="Arial" font-size="11">🏛️ Musei</text>
  
  <rect x="210" y="130" width="50" height="30" rx="15" fill="#eee"/>
  <text x="220" y="150" fill="#333" font-family="Arial" font-size="11">⚡ HP</text>
  
  <!-- CIBO ATTIVO -->
  <rect x="265" y="130" width="55" height="30" rx="15" fill="#F39C12"/>
  <text x="273" y="150" fill="white" font-family="Arial" font-size="11" font-weight="bold">🍕 Cibo</text>
  
  <rect x="325" y="130" width="55" height="30" rx="15" fill="#eee"/>
  <text x="333" y="150" fill="#333" font-family="Arial" font-size="11">🛍️ Shop</text>
  
  <!-- Time Filter -->
  <rect x="20" y="170" width="350" height="35" rx="8" fill="#f8f9fa"/>
  <text x="30" y="193" fill="#333" font-family="Arial" font-size="12">⏱️ Ho:</text>
  <rect x="80" y="175" width="150" height="25" rx="6" fill="white" stroke="#ddd"/>
  <text x="90" y="193" fill="#333" font-family="Arial" font-size="11">1 ora ▼</text>
  
  <!-- Map Area -->
  <rect x="20" y="215" width="350" height="480" rx="12" fill="#e8f4e5"/>
  
  <!-- Street Grid -->
  <line x1="20" y1="300" x2="370" y2="300" stroke="#ccc" stroke-width="2"/>
  <line x1="20" y1="400" x2="370" y2="400" stroke="#bbb" stroke-width="3"/>
  <line x1="20" y1="500" x2="370" y2="500" stroke="#ccc" stroke-width="2"/>
  <line x1="20" y1="600" x2="370" y2="600" stroke="#ccc" stroke-width="2"/>
  <line x1="100" y1="215" x2="100" y2="695" stroke="#ccc" stroke-width="2"/>
  <line x1="195" y1="215" x2="195" y2="695" stroke="#bbb" stroke-width="3"/>
  <line x1="290" y1="215" x2="290" y2="695" stroke="#ccc" stroke-width="2"/>
  
  <!-- Solo Markers FOOD (arancioni) -->
  <circle cx="80" cy="350" r="18" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="71" y="356" font-size="16">🍕</text>
  
  <circle cx="180" cy="420" r="18" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="171" y="426" font-size="16">🍔</text>
  
  <circle cx="280" cy="380" r="18" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="271" y="386" font-size="16">🍪</text>
  
  <circle cx="320" cy="520" r="18" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="311" y="526" font-size="16">☕</text>
  
  <circle cx="120" cy="550" r="18" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="111" y="556" font-size="16">🥞</text>
  
  <circle cx="220" cy="600" r="18" fill="#F39C12" stroke="white" stroke-width="3"/>
  <text x="211" y="606" font-size="16">🍦</text>
  
  <!-- User Location -->
  <circle cx="195" cy="450" r="8" fill="#4285f4" stroke="white" stroke-width="3"/>
  
  <!-- Counter - 75 luoghi filtrati -->
  <rect x="25" y="650" width="100" height="35" rx="17" fill="white" filter="url(#shadow)"/>
  <text x="40" y="673" fill="#333" font-family="Arial" font-size="12" font-weight="bold">🗺️ 75 luoghi</text>
  
  <!-- Float Buttons -->
  <circle cx="345" cy="620" r="22" fill="white" filter="url(#shadow)"/>
  <text x="337" y="626" font-size="18">🎯</text>
  
  <circle cx="345" cy="670" r="22" fill="white" filter="url(#shadow)"/>
  <text x="337" y="676" font-size="18">💬</text>
  
  <!-- Chat Header -->
  <rect x="10" y="710" width="370" height="60" rx="20" fill="url(#gradient1)"/>
  <circle cx="45" cy="740" r="18" fill="rgba(255,255,255,0.2)"/>
  <text x="37" y="746" font-size="16">🤖</text>
  <text x="70" y="733" fill="white" font-family="Arial" font-size="13" font-weight="bold">Guida NYC</text>
  <text x="70" y="750" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="10">Filtro: Cibo 🍕</text>
  <text x="350" y="745" fill="white" font-size="18">▲</text>
  
  <!-- Home Indicator -->
  <rect x="145" y="800" width="100" height="5" rx="2" fill="#333"/>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>