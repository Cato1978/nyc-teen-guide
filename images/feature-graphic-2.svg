<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="1024" height="500" fill="url(#bg2)"/>
  
  <!-- NYC Skyline silhouette -->
  <g fill="#667eea" opacity="0.3">
    <!-- Buildings -->
    <rect x="50" y="320" width="40" height="180"/>
    <rect x="100" y="280" width="50" height="220"/>
    <rect x="160" y="200" width="35" height="300"/>
    <rect x="200" y="250" width="45" height="250"/>
    <!-- Empire State style -->
    <rect x="260" y="150" width="60" height="350"/>
    <rect x="275" y="120" width="30" height="30"/>
    <rect x="285" y="80" width="10" height="40"/>
    
    <rect x="340" y="220" width="50" height="280"/>
    <rect x="400" y="300" width="40" height="200"/>
    <rect x="450" y="260" width="55" height="240"/>
    
    <!-- One WTC style -->
    <rect x="520" y="100" width="50" height="400"/>
    <polygon points="545,100 520,150 570,150"/>
    
    <rect x="590" y="280" width="45" height="220"/>
    <rect x="650" y="320" width="35" height="180"/>
    <rect x="700" y="250" width="50" height="250"/>
    <rect x="760" y="300" width="40" height="200"/>
    <rect x="810" y="340" width="55" height="160"/>
    <rect x="880" y="290" width="45" height="210"/>
    <rect x="940" y="350" width="40" height="150"/>
  </g>
  
  <!-- Map overlay in center -->
  <g transform="translate(362, 100)">
    <rect x="0" y="0" width="300" height="200" rx="15" fill="white" opacity="0.95"/>
    
    <!-- Map grid -->
    <g stroke="#e0e0e0" stroke-width="1">
      <line x1="0" y1="50" x2="300" y2="50"/>
      <line x1="0" y1="100" x2="300" y2="100"/>
      <line x1="0" y1="150" x2="300" y2="150"/>
      <line x1="75" y1="0" x2="75" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="200"/>
      <line x1="225" y1="0" x2="225" y2="200"/>
    </g>
    
    <!-- Central Park -->
    <rect x="100" y="20" width="100" height="60" rx="5" fill="#81c784" opacity="0.7"/>
    
    <!-- Markers with shadows -->
    <g font-size="28">
      <text x="40" y="45">📍</text>
      <text x="130" y="65">⚡</text>
      <text x="200" y="45">🏛️</text>
      <text x="60" y="130">🍕</text>
      <text x="140" y="120">🗽</text>
      <text x="220" y="110">🎬</text>
      <text x="30" y="180">🛍️</text>
      <text x="110" y="175">⭐</text>
      <text x="180" y="185">🎭</text>
      <text x="250" y="165">🍪</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="512" y="380" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="white" text-anchor="middle">NYC Teen Guide</text>
  <text x="512" y="430" font-family="Arial, sans-serif" font-size="26" fill="#667eea" text-anchor="middle">⚡ Harry Potter • 🗺️ 300+ Places • 👨‍👩‍👧‍👦 Family Friendly</text>
  
  <!-- Decorative stars -->
  <text x="80" y="80" font-size="30" opacity="0.5">✨</text>
  <text x="920" y="120" font-size="35" opacity="0.5">🌟</text>
  <text x="180" y="450" font-size="25" opacity="0.4">⭐</text>
  <text x="850" y="470" font-size="28" opacity="0.4">✨</text>
</svg>