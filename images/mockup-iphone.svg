<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 900" width="450" height="900">
  <!-- iPhone Frame -->
  <rect x="25" y="10" width="400" height="880" rx="55" fill="#1a1a1a"/>
  <rect x="35" y="20" width="380" height="860" rx="48" fill="#f5f6fa"/>
  
  <!-- Dynamic Island -->
  <rect x="160" y="30" width="130" height="35" rx="17" fill="#1a1a1a"/>
  
  <!-- Status Bar -->
  <text x="55" y="55" fill="#333" font-family="Arial" font-size="14" font-weight="bold">9:41</text>
  <text x="355" y="55" fill="#333" font-family="Arial" font-size="12">📶 🔋</text>
  
  <!-- Search Bar -->
  <rect x="45" y="75" width="360" height="50" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="65" y="105" fill="#888" font-family="Arial" font-size="14">🔍 Cerca indirizzo...</text>
  <rect x="355" y="83" width="40" height="34" rx="8" fill="#2ecc71"/>
  <text x="367" y="105" fill="white" font-family="Arial" font-size="16">📍</text>
  
  <!-- Filter Chips -->
  <rect x="45" y="135" width="55" height="28" rx="14" fill="#667eea"/>
  <text x="52" y="154" fill="white" font-family="Arial" font-size="10">🗽 Tutti</text>
  
  <rect x="105" y="135" width="50" height="28" rx="14" fill="#eee"/>
  <text x="112" y="154" fill="#333" font-family="Arial" font-size="10">🎢 Attr</text>
  
  <rect x="160" y="135" width="55" height="28" rx="14" fill="#eee"/>
  <text x="165" y="154" fill="#333" font-family="Arial" font-size="10">🏛️ Musei</text>
  
  <rect x="220" y="135" width="45" height="28" rx="14" fill="#eee"/>
  <text x="228" y="154" fill="#333" font-family="Arial" font-size="10">⚡ HP</text>
  
  <rect x="270" y="135" width="50" height="28" rx="14" fill="#eee"/>
  <text x="278" y="154" fill="#333" font-family="Arial" font-size="10">🍕 Cibo</text>
  
  <rect x="325" y="135" width="50" height="28" rx="14" fill="#eee"/>
  <text x="332" y="154" fill="#333" font-family="Arial" font-size="10">🛍️ Shop</text>
  
  <!-- Time Filter -->
  <rect x="45" y="170" width="360" height="30" rx="8" fill="#f8f9fa"/>
  <text x="55" y="190" fill="#333" font-family="Arial" font-size="11">⏱️ Ho:</text>
  <rect x="100" y="175" width="130" height="22" rx="6" fill="white" stroke="#ddd"/>
  <text x="110" y="191" fill="#333" font-family="Arial" font-size="10">Tutto il tempo ▼</text>
  
  <!-- Map Area -->
  <rect x="35" y="210" width="380" height="510" rx="12" fill="#e8f4e5"/>
  
  <!-- Street Grid Pattern -->
  <line x1="35" y1="300" x2="415" y2="300" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="35" y1="380" x2="415" y2="380" stroke="#c0c0c0" stroke-width="3"/>
  <line x1="35" y1="460" x2="415" y2="460" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="35" y1="540" x2="415" y2="540" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="35" y1="620" x2="415" y2="620" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="120" y1="210" x2="120" y2="720" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="225" y1="210" x2="225" y2="720" stroke="#c0c0c0" stroke-width="3"/>
  <line x1="330" y1="210" x2="330" y2="720" stroke="#d4d4d4" stroke-width="2"/>
  
  <!-- Park Area -->
  <rect x="140" y="230" width="170" height="90" rx="8" fill="#a8d5a2"/>
  <text x="180" y="280" fill="#2d5a27" font-family="Arial" font-size="11">🌳 Central Park</text>
  
  <!-- Water -->
  <ellipse cx="380" cy="650" rx="40" ry="60" fill="#b8d4e8"/>
  
  <!-- Markers -->
  <circle cx="100" cy="350" r="14" fill="#FF6B6B" stroke="white" stroke-width="2"/>
  <text x="93" y="355" font-size="12">🏙️</text>
  
  <circle cx="180" cy="420" r="14" fill="#3498DB" stroke="white" stroke-width="2"/>
  <text x="173" y="425" font-size="12">🏛️</text>
  
  <circle cx="280" cy="380" r="14" fill="#F39C12" stroke="white" stroke-width="2"/>
  <text x="273" y="385" font-size="12">🍕</text>
  
  <circle cx="350" cy="480" r="14" fill="#9B59B6" stroke="white" stroke-width="2"/>
  <text x="343" y="485" font-size="12">⚡</text>
  
  <circle cx="225" cy="550" r="14" fill="#1ABC9C" stroke="white" stroke-width="2"/>
  <text x="218" y="555" font-size="12">🛍️</text>
  
  <circle cx="130" cy="500" r="14" fill="#F39C12" stroke="white" stroke-width="2"/>
  <text x="123" y="505" font-size="12">🍔</text>
  
  <circle cx="300" cy="600" r="14" fill="#FF6B6B" stroke="white" stroke-width="2"/>
  <text x="293" y="605" font-size="12">🌉</text>
  
  <!-- User Location -->
  <circle cx="225" cy="450" r="8" fill="#4285f4" stroke="white" stroke-width="3"/>
  <circle cx="225" cy="450" r="16" fill="rgba(66,133,244,0.2)"/>
  
  <!-- Counter -->
  <rect x="45" y="675" width="100" height="32" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="55" y="696" fill="#333" font-family="Arial" font-size="11" font-weight="bold">🗺️ 200 luoghi</text>
  
  <!-- Float Buttons -->
  <circle cx="380" cy="640" r="20" fill="white" filter="url(#shadow)"/>
  <text x="372" y="646" font-size="16">🎯</text>
  
  <circle cx="380" cy="690" r="20" fill="white" filter="url(#shadow)"/>
  <text x="372" y="696" font-size="16">💬</text>
  
  <!-- Chat Header -->
  <rect x="35" y="730" width="380" height="60" rx="20" fill="url(#gradient1)"/>
  <circle cx="65" cy="760" r="16" fill="rgba(255,255,255,0.2)"/>
  <text x="58" y="766" font-size="14">🤖</text>
  <text x="90" y="753" fill="white" font-family="Arial" font-size="12" font-weight="bold">Guida NYC</text>
  <text x="90" y="770" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="10">200 luoghi! Chiedimi tutto!</text>
  <text x="390" y="765" fill="white" font-size="16">▲</text>
  
  <!-- Home Indicator -->
  <rect x="175" y="855" width="100" height="5" rx="2" fill="#333"/>
  
  <!-- Device Label -->
  <text x="225" y="895" fill="#888" font-family="Arial" font-size="11" text-anchor="middle">iPhone 14 Pro</text>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>