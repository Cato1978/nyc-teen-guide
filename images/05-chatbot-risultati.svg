<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Phone Frame -->
  <rect width="390" height="844" rx="40" fill="#1a1a1a"/>
  <rect x="10" y="10" width="370" height="824" rx="32" fill="#f5f6fa"/>
  
  <!-- Status Bar -->
  <rect x="10" y="10" width="370" height="50" rx="32" fill="url(#gradient1)"/>
  <text x="30" y="40" fill="white" font-family="Arial" font-size="14">9:41</text>
  <text x="320" y="40" fill="white" font-family="Arial" font-size="14">100% 🔋</text>
  
  <!-- Chat Header -->
  <rect x="10" y="60" width="370" height="60" fill="url(#gradient1)"/>
  <circle cx="45" cy="90" r="22" fill="rgba(255,255,255,0.2)"/>
  <text x="35" y="96" font-size="20">🤖</text>
  <text x="75" y="85" fill="white" font-family="Arial" font-size="16" font-weight="bold">Guida NYC</text>
  <text x="75" y="102" fill="rgba(255,255,255,0.8)" font-family="Arial" font-size="11">200 luoghi! Chiedimi tutto!</text>
  <text x="350" y="95" fill="white" font-size="20">▼</text>
  
  <!-- Chat Messages Area -->
  <rect x="10" y="120" width="370" height="600" fill="#f5f6fa"/>
  
  <!-- User Message -->
  <rect x="150" y="140" width="210" height="40" rx="18" fill="url(#gradient1)"/>
  <text x="170" y="166" fill="white" font-family="Arial" font-size="14">Ho fame! 🍽️</text>
  
  <!-- Bot Response -->
  <rect x="20" y="200" width="300" height="380" rx="18" fill="white" filter="url(#shadow)"/>
  
  <!-- Bot Avatar -->
  <circle cx="35" cy="190" r="12" fill="url(#gradient1)"/>
  <text x="29" y="194" font-size="12">🤖</text>
  
  <!-- Response Header -->
  <text x="35" y="230" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Hai fame? 🍽️ Ecco i best:</text>
  
  <!-- Result 1 -->
  <rect x="30" y="250" width="280" height="60" rx="10" fill="#fff3e6" stroke="#f39c12" stroke-width="1"/>
  <text x="45" y="275" font-size="18">🍕</text>
  <text x="70" y="273" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Joe's Pizza</text>
  <text x="70" y="290" fill="#666" font-family="Arial" font-size="10">350m • ⏱️ 20min • 💵 $3</text>
  <text x="210" y="275" fill="#f39c12" font-family="Arial" font-size="11">⭐ 4.9</text>
  <rect x="250" y="260" width="50" height="28" rx="14" fill="#2ecc71"/>
  <text x="260" y="279" fill="white" font-family="Arial" font-size="10" font-weight="bold">🗺️ Vai</text>
  
  <!-- Result 2 -->
  <rect x="30" y="320" width="280" height="60" rx="10" fill="#fff3e6" stroke="#f39c12" stroke-width="1"/>
  <text x="45" y="345" font-size="18">🍔</text>
  <text x="70" y="343" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Shake Shack</text>
  <text x="70" y="360" fill="#666" font-family="Arial" font-size="10">500m • ⏱️ 30min • 💵 $12</text>
  <text x="210" y="345" fill="#f39c12" font-family="Arial" font-size="11">⭐ 4.8</text>
  <rect x="250" y="330" width="50" height="28" rx="14" fill="#2ecc71"/>
  <text x="260" y="349" fill="white" font-family="Arial" font-size="10" font-weight="bold">🗺️ Vai</text>
  
  <!-- Result 3 -->
  <rect x="30" y="390" width="280" height="60" rx="10" fill="#fff3e6" stroke="#f39c12" stroke-width="1"/>
  <text x="45" y="415" font-size="18">🌮</text>
  <text x="70" y="413" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Los Tacos No.1</text>
  <text x="70" y="430" fill="#666" font-family="Arial" font-size="10">800m • ⏱️ 25min • 💵 $8</text>
  <text x="210" y="415" fill="#f39c12" font-family="Arial" font-size="11">⭐ 4.7</text>
  <rect x="250" y="400" width="50" height="28" rx="14" fill="#2ecc71"/>
  <text x="260" y="419" fill="white" font-family="Arial" font-size="10" font-weight="bold">🗺️ Vai</text>
  
  <!-- Result 4 -->
  <rect x="30" y="460" width="280" height="60" rx="10" fill="#fff3e6" stroke="#f39c12" stroke-width="1"/>
  <text x="45" y="485" font-size="18">🍜</text>
  <text x="70" y="483" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Xi'an Famous Foods</text>
  <text x="70" y="500" fill="#666" font-family="Arial" font-size="10">1.2km • ⏱️ 35min • 💵 $10</text>
  <text x="210" y="485" fill="#f39c12" font-family="Arial" font-size="11">⭐ 4.6</text>
  <rect x="250" y="470" width="50" height="28" rx="14" fill="#2ecc71"/>
  <text x="260" y="489" fill="white" font-family="Arial" font-size="10" font-weight="bold">🗺️ Vai</text>
  
  <!-- Result 5 -->
  <rect x="30" y="530" width="280" height="45" rx="10" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="558" font-size="16">🥯</text>
  <text x="70" y="556" fill="#333" font-family="Arial" font-size="12">+ altri 70 ristoranti...</text>
  
  <!-- Input Area -->
  <rect x="10" y="720" width="370" height="70" fill="white"/>
  <rect x="20" y="735" width="290" height="40" rx="20" fill="#f5f6fa" stroke="#ddd"/>
  <text x="40" y="760" fill="#888" font-family="Arial" font-size="13">Scrivi un messaggio...</text>
  <circle cx="345" cy="755" r="22" fill="url(#gradient1)"/>
  <text x="337" y="762" fill="white" font-size="18">➤</text>
  
  <!-- Home Indicator -->
  <rect x="145" y="800" width="100" height="5" rx="2" fill="#333"/>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>