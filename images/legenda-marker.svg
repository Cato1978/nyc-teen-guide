<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Background -->
  <rect width="400" height="200" fill="#f8f9fa" rx="12"/>
  
  <!-- Title -->
  <text x="200" y="30" fill="#333" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">🎨 Legenda Colori Marker</text>
  
  <!-- Row 1 -->
  <circle cx="50" cy="70" r="18" fill="#FF6B6B" stroke="white" stroke-width="2"/>
  <text x="40" y="76" font-size="16">🎢</text>
  <text x="80" y="75" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Attrazioni</text>
  <text x="80" y="92" fill="#666" font-family="Arial" font-size="11">Empire State, Brooklyn Bridge...</text>
  
  <circle cx="250" cy="70" r="18" fill="#3498DB" stroke="white" stroke-width="2"/>
  <text x="240" y="76" font-size="16">🏛️</text>
  <text x="280" y="75" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Musei</text>
  <text x="280" y="92" fill="#666" font-family="Arial" font-size="11">MoMA, Met, Natural History</text>
  
  <!-- Row 2 -->
  <circle cx="50" cy="130" r="18" fill="#9B59B6" stroke="white" stroke-width="2"/>
  <text x="40" y="136" font-size="16">⚡</text>
  <text x="80" y="135" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Harry Potter</text>
  <text x="80" y="152" fill="#666" font-family="Arial" font-size="11">HP Store, Cursed Child</text>
  
  <circle cx="250" cy="130" r="18" fill="#F39C12" stroke="white" stroke-width="2"/>
  <text x="240" y="136" font-size="16">🍕</text>
  <text x="280" y="135" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Cibo</text>
  <text x="280" y="152" fill="#666" font-family="Arial" font-size="11">Pizza, Burger, Dolci, Caffè</text>
  
  <!-- Row 3 -->
  <circle cx="150" cy="175" r="18" fill="#1ABC9C" stroke="white" stroke-width="2"/>
  <text x="140" y="181" font-size="16">🛍️</text>
  <text x="180" y="180" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Shopping</text>
  <text x="260" y="180" fill="#666" font-family="Arial" font-size="11">Nike, Apple, Vintage</text>
