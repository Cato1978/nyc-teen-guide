<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 400" width="390" height="400">
  <!-- Background -->
  <rect width="390" height="400" rx="20" fill="#f5f6fa"/>
  
  <!-- Title -->
  <text x="195" y="35" fill="#333" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">⚡ Quick Actions</text>
  <text x="195" y="55" fill="#666" font-family="Arial" font-size="12" text-anchor="middle">Tocca per chiedere velocemente</text>
  
  <!-- Row 1 -->
  <rect x="20" y="80" width="85" height="70" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="62" y="115" font-size="24" text-anchor="middle">🍕</text>
  <text x="62" y="138" fill="#333" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Ho fame</text>
  
  <rect x="115" y="80" width="85" height="70" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="157" y="115" font-size="24" text-anchor="middle">📍</text>
  <text x="157" y="138" fill="#333" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Vicino</text>
  
  <rect x="210" y="80" width="85" height="70" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="252" y="115" font-size="24" text-anchor="middle">🛍️</text>
  <text x="252" y="138" fill="#333" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Shopping</text>
  
  <rect x="305" y="80" width="65" height="70" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="337" y="115" font-size="24" text-anchor="middle">📸</text>
  <text x="337" y="138" fill="#333" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Insta</text>
  
  <!-- Row 2 -->
  <rect x="20" y="165" width="85" height="70" rx="15" fill="#f3e8ff" stroke="#9b59b6" stroke-width="2"/>
  <text x="62" y="200" font-size="24" text-anchor="middle">⚡</text>
  <text x="62" y="223" fill="#9b59b6" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">HP</text>
  
  <rect x="115" y="165" width="85" height="70" rx="15" fill="#e8f8e8" stroke="#2ecc71" stroke-width="2"/>
  <text x="157" y="200" font-size="24" text-anchor="middle">🎉</text>
  <text x="157" y="223" fill="#27ae60" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Gratis</text>
  
  <rect x="210" y="165" width="85" height="70" rx="15" fill="#fff3e6" stroke="#f39c12" stroke-width="2"/>
  <text x="252" y="200" font-size="24" text-anchor="middle">🍪</text>
  <text x="252" y="223" fill="#e67e22" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Dolci</text>
  
  <rect x="305" y="165" width="65" height="70" rx="15" fill="#ffe6e6" stroke="#e74c3c" stroke-width="2"/>
  <text x="337" y="200" font-size="24" text-anchor="middle">🍕</text>
  <text x="337" y="223" fill="#c0392b" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Pizza</text>
  
  <!-- Additional Actions Row -->
  <rect x="20" y="250" width="110" height="55" rx="12" fill="#e7f3ff" stroke="#3498db" stroke-width="1"/>
  <text x="75" y="280" font-size="18" text-anchor="middle">🏛️</text>
  <text x="75" y="296" fill="#2980b9" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Musei</text>
  
  <rect x="140" y="250" width="110" height="55" rx="12" fill="#ffe6e6" stroke="#e74c3c" stroke-width="1"/>
  <text x="195" y="280" font-size="18" text-anchor="middle">🎢</text>
  <text x="195" y="296" fill="#c0392b" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Attrazioni</text>
  
  <rect x="260" y="250" width="110" height="55" rx="12" fill="#e8f8f0" stroke="#1abc9c" stroke-width="1"/>
  <text x="315" y="280" font-size="18" text-anchor="middle">🏙️</text>
  <text x="315" y="296" fill="#16a085" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Vista</text>
  
  <!-- Info Box -->
  <rect x="20" y="320" width="350" height="60" rx="12" fill="url(#gradient1)"/>
  <text x="40" y="350" fill="white" font-family="Arial" font-size="13" font-weight="bold">💡 Tip: Puoi anche scrivere!</text>
  <text x="40" y="368" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="11">Es: "burger vicino", "cosa gratis", "posti TikTok"</text>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>