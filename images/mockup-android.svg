<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 900" width="450" height="900">
  <!-- Android Phone Frame (Pixel 7 style) -->
  <rect x="25" y="10" width="400" height="880" rx="40" fill="#1a1a1a"/>
  <rect x="35" y="20" width="380" height="860" rx="35" fill="#f5f6fa"/>
  
  <!-- Camera Punch Hole -->
  <circle cx="225" cy="45" r="10" fill="#1a1a1a"/>
  
  <!-- Status Bar -->
  <text x="55" y="50" fill="#333" font-family="Arial" font-size="14">12:30</text>
  <text x="340" y="50" fill="#333" font-family="Arial" font-size="12">📶 📍 🔋</text>
  
  <!-- Search Bar -->
  <rect x="45" y="70" width="360" height="50" rx="25" fill="white" filter="url(#shadow)"/>
  <text x="70" y="100" fill="#888" font-family="Arial" font-size="14">🔍 Cerca indirizzo...</text>
  <rect x="355" y="78" width="40" height="34" rx="17" fill="#2ecc71"/>
  <text x="367" y="100" fill="white" font-family="Arial" font-size="16">📍</text>
  
  <!-- Filter Chips (Material Design style) -->
  <rect x="45" y="130" width="55" height="32" rx="16" fill="#667eea"/>
  <text x="52" y="151" fill="white" font-family="Arial" font-size="10">🗽 Tutti</text>
  
  <rect x="105" y="130" width="50" height="32" rx="16" fill="#f0f0f0"/>
  <text x="112" y="151" fill="#333" font-family="Arial" font-size="10">🎢 Attr</text>
  
  <rect x="160" y="130" width="58" height="32" rx="16" fill="#f0f0f0"/>
  <text x="167" y="151" fill="#333" font-family="Arial" font-size="10">🏛️ Musei</text>
  
  <rect x="223" y="130" width="45" height="32" rx="16" fill="#f0f0f0"/>
  <text x="231" y="151" fill="#333" font-family="Arial" font-size="10">⚡ HP</text>
  
  <rect x="273" y="130" width="52" height="32" rx="16" fill="#f0f0f0"/>
  <text x="281" y="151" fill="#333" font-family="Arial" font-size="10">🍕 Cibo</text>
  
  <rect x="330" y="130" width="52" height="32" rx="16" fill="#f0f0f0"/>
  <text x="337" y="151" fill="#333" font-family="Arial" font-size="10">🛍️ Shop</text>
  
  <!-- Time Filter -->
  <rect x="45" y="172" width="360" height="32" rx="8" fill="#fafafa"/>
  <text x="55" y="193" fill="#333" font-family="Arial" font-size="11">⏱️ Ho:</text>
  <rect x="100" y="177" width="140" height="24" rx="12" fill="white" stroke="#ddd"/>
  <text x="115" y="194" fill="#333" font-family="Arial" font-size="10">Tutto il tempo ▼</text>
  
  <!-- Map Area -->
  <rect x="35" y="215" width="380" height="510" rx="0" fill="#e8f4e5"/>
  
  <!-- Street Grid Pattern -->
  <line x1="35" y1="300" x2="415" y2="300" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="35" y1="380" x2="415" y2="380" stroke="#c0c0c0" stroke-width="3"/>
  <line x1="35" y1="460" x2="415" y2="460" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="35" y1="540" x2="415" y2="540" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="35" y1="620" x2="415" y2="620" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="120" y1="215" x2="120" y2="725" stroke="#d4d4d4" stroke-width="2"/>
  <line x1="225" y1="215" x2="225" y2="725" stroke="#c0c0c0" stroke-width="3"/>
  <line x1="330" y1="215" x2="330" y2="725" stroke="#d4d4d4" stroke-width="2"/>
  
  <!-- Park Area -->
  <rect x="140" y="235" width="170" height="85" rx="6" fill="#a8d5a2"/>
  <text x="180" y="285" fill="#2d5a27" font-family="Arial" font-size="11">🌳 Central Park</text>
  
  <!-- Water Area -->
  <ellipse cx="80" cy="680" rx="50" ry="35" fill="#b8d4e8"/>
  
  <!-- Markers -->
  <circle cx="100" cy="350" r="14" fill="#FF6B6B" stroke="white" stroke-width="2"/>
  <text x="93" y="355" font-size="12">🏙️</text>
  
  <circle cx="180" cy="420" r="14" fill="#3498DB" stroke="white" stroke-width="2"/>
  <text x="173" y="425" font-size="12">🏛️</text>
  
  <circle cx="280" cy="380" r="14" fill="#F39C12" stroke="white" stroke-width="2"/>
  <text x="273" y="385" font-size="12">🍕</text>
  
  <circle cx="350" cy="480" r="14" fill="#9B59B6" stroke="white" stroke-width="2"/>
  <text x="343" y="485" font-size="12">⚡</text>
  
  <circle cx="225" cy="550" r="14" fill="#1ABC9C" stroke="white" stroke-width="2"/>
  <text x="218" y="555" font-size="12">🛍️</text>
  
  <circle cx="130" cy="500" r="14" fill="#F39C12" stroke="white" stroke-width="2"/>
  <text x="123" y="505" font-size="12">🍔</text>
  
  <circle cx="300" cy="600" r="14" fill="#FF6B6B" stroke="white" stroke-width="2"/>
  <text x="293" y="605" font-size="12">🗽</text>
  
  <!-- User Location -->
  <circle cx="225" cy="450" r="8" fill="#4285f4" stroke="white" stroke-width="3"/>
  <circle cx="225" cy="450" r="16" fill="rgba(66,133,244,0.2)"/>
  
  <!-- Counter -->
  <rect x="45" y="678" width="105" height="35" rx="18" fill="white" filter="url(#shadow)"/>
  <text x="58" y="701" fill="#333" font-family="Arial" font-size="12" font-weight="bold">🗺️ 200 luoghi</text>
  
  <!-- FAB Buttons (Material Design) -->
  <circle cx="380" cy="640" r="24" fill="white" filter="url(#shadow)"/>
  <text x="371" y="647" font-size="18">🎯</text>
  
  <circle cx="380" cy="700" r="28" fill="url(#gradient1)" filter="url(#shadow)"/>
  <text x="371" y="707" font-size="20">💬</text>
  
  <!-- Bottom Sheet (Chat Header) -->
  <rect x="35" y="735" width="380" height="65" rx="20" fill="white" filter="url(#shadowTop)"/>
  <rect x="185" y="742" width="80" height="4" rx="2" fill="#ddd"/>
  <circle cx="65" cy="775" r="18" fill="url(#gradient1)"/>
  <text x="56" y="782" font-size="16">🤖</text>
  <text x="95" y="768" fill="#333" font-family="Arial" font-size="13" font-weight="bold">Guida NYC</text>
  <text x="95" y="786" fill="#666" font-family="Arial" font-size="10">200 luoghi! Chiedimi tutto!</text>
  
  <!-- Android Navigation Bar -->
  <rect x="35" y="810" width="380" height="60" fill="#fafafa"/>
  <text x="120" y="845" fill="#666" font-size="20">◀</text>
  <circle cx="225" cy="840" r="15" fill="none" stroke="#666" stroke-width="2"/>
  <rect x="305" y="830" width="20" height="20" rx="4" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Device Label -->
  <text x="225" y="895" fill="#888" font-family="Arial" font-size="11" text-anchor="middle">Google Pixel 7</text>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowTop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-3" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>